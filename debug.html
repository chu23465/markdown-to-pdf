<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #0d1117;
    }
    .inputDiv {
      box-sizing: border-box;
      max-width: fit-content;
      //padding: 15px;
      margin: 1% 0;
      display: flex;
      flex-direction: row;
    } 
    #pdfGen {
      margin-left: 6%;
    }
    .markdown-body {
      box-sizing: border-box;
      max-width: 1200px;
      //max-width: auto;
      margin: 0 auto;
      padding: 45px;
      border: .0625rem solid;
      border-radius: .375rem;
      border-color: #3d444d;
      flex-direction: column;
      flex-grow: 1;
      display: flex;
    }
    .markdown-body img {
      width: max-content; 
      //Stretches out otherwise
    }
    //# Print styles come last due to linear ie sequential parsing of css
    @media print {
      #header None,
      #footer None,
      #nav {
        display: none !important;
      }
    }
    @media print {
      body {
        background-color: white;
      }
      #nav {
        display: none !important;
      }
      .inputDiv {
        display: none !important;
      }
      .markdown-body {
        border: none;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
        break-after: auto;
        break-before: auto;
        //break-inside: avoid-region;
      }
    }
    @page {
      size: a4;
      margin-top: 0.44in;
      margin-bottom: 0.3in;
      margin-right: 0;
      margin-left: 0;

    }
    @page :first {
      size: a4;
      margin-top: 0;
      margin-bottom: 0.3in;
      margin-right: 0;
      margin-left: 0;
    }
  </style>
  <link rel="stylesheet" href="github.button.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.css" integrity="sha512-Hasfm7Iv5AG2/v5DSRXetpC33VjyPBXn5giooMag2EgSbiJ2Xp4GGvYGKSvc68SiJIflF/WrbDFdNmtlZHE5HA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div id="inputDiv" class="inputDiv">
    <input type="file" id="fileInput" accept=".md" hidden>
    <button type="button" class="buttonwithCSS" id="uploadBtn" aria-label="Choose Markdown File">Choose Markdown File</button>
    <button type="button" class="buttonwithCSS" id="pdfGen" aria-label="Generate PDF">Generate PDF</button>
  </div>
  <article class="markdown-body" id="markdown-body"></article>
  <script src="index.ts"></script>
  <!-- Script at the end otherwise it doesn't detect all elements-->
</body>
</html>
